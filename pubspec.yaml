name: tan_sdk
description: A Flutter SDK package providing core functionality, utilities, and services for Flutter applications.
version: 0.0.1
homepage: https://github.com/yourusername/tan_sdk
repository: https://github.com/yourusername/tan_sdk
issue_tracker: https://github.com/yourusername/tan_sdk/issues

environment:
  sdk: ^3.5.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.4
  http: ^1.1.0
  iconsax_flutter: ^1.0.0
  country_code_picker: ^3.0.0
  pinput: ^2.2.0
  device_info_plus: ^10.1.0
  geolocator: ^12.0.0
  core:
    path: Core
  vlens: ^0.1.8
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  assets:
    - assets/images/
